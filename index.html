<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="myLibraryBox">

        <aside class="sidebar">
            <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>book-open-page-variant-outline</title>
                <path d="M19 1L14 6V17L19 12.5V1M21 5V18.5C19.9 18.15 18.7 18 17.5 18C15.8 18 13.35 18.65 12 19.5V6C10.55 4.9 8.45 4.5 6.5 4.5C4.55 4.5 2.45 4.9 1 6V20.65C1 20.9 1.25 21.15 1.5 21.15C1.6 21.15 1.65 21.1 1.75 21.1C3.1 20.45 5.05 20 6.5 20C8.45 20 10.55 20.4 12 21.5C13.35 20.65 15.8 20 17.5 20C19.15 20 20.85 20.3 22.25 21.05C22.35 21.1 22.4 21.1 22.5 21.1C22.75 21.1 23 20.85 23 20.6V6C22.4 5.55 21.75 5.25 21 5M10 18.41C8.75 18.09 7.5 18 6.5 18C5.44 18 4.18 18.19 3 18.5V7.13C3.91 6.73 5.14 6.5 6.5 6.5C7.86 6.5 9.09 6.73 10 7.13V18.41Z" />
            </svg>Library</div>
            <ul class="links">
                <li><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20px"><title>home</title><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" /></svg>
                <div>Home</div></li>
                <li class="theLink"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>bookshelf</title><path d="M9 3V18H12V3H9M12 5L16 18L19 17L15 4L12 5M5 5V18H8V5H5M3 19V21H21V19H3Z" /></svg>
                <div>My Library</div></li>
            </ul>
            <button id="btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>plus-thick</title><path d="M20 14H14V20H10V14H4V10H10V4H14V10H20V14Z" /></svg>
                 Add Book</button>
        </aside>
        <main class="main">
            <div class="search"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>magnify</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
                <input placeholder="Search in My Library"></div>
            <div class="myBooks">
                <div class="shelf" id="shelf2">Want to Read<div class="nextUp">

                </div></div>

                <div class="shelf" id="shelf1">Currently reading<div class="currentlyReading">
            
                </div></div>
                
                <div class="shelf" id="shelf3">Finished<div class="finished">
                    
                </div></div>
            </div>
        </main>
        <footer class="footer">
            <span>Created by Angelika Kowalik for The Odin Project</span>
        </footer>
    </div>
        <div class="overlay hidden">
            <div class="form">
                <div>
                <form action="" method="POST">
                    <label for="name">Title *</label>
                    <input type="text" id="name" name="name" required>
                    <label for="author">Author *</label>
                    <input type="text" id="author" name="author" required>
                    <label for="pages">Pages *</label>
                    <input type="number" id="pages" name="pages" required>
                    <label for="img">Img *</label>
                    <input type="url" id="img" name="img" placeholder="https://example.com" required>
                    <fieldset>
                        <legend>Reading status *</legend>
                            <label>
                            <input type="radio" name="read" value="Finished" required>
                            Finished
                            </label>
                            <label>
                            <input type="radio" name="read" value="Currently Reading">
                            Currently Reading
                            </label>
                            <label>
                            <input type="radio" name="read" value="Want to Read">
                            Want to Read
                            </label>
                    </fieldset>
                    <div class="infoRequired"> *Required</div>
                     <button class="add" type="button">Add Book</button>
                </form>
                
                </div>
                <button class="btnExit">×</button>
            </div>
        </div>


    <script src="index.js"></script>
</body>
</html>
